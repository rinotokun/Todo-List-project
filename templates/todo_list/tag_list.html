{% extends "base.html" %}

{% block content %}
  <h1>Tags
    <a href="{% url 'todo_list:tag-create' %}?next={{ request.get_full_path|urlencode }}" class="link-to-page btn btn-primary fs-5">Add</a>
  </h1>
  <hr>
  {% if tag_list %}
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Update</th>
          <th scope="col">Delete</th>
        </tr>
      </thead>
      <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <a href="{% url 'todo_list:tag-update' pk=tag.id %}?next={{ request.get_full_path|urlencode }}" class="btn btn-secondary">Update</a>
          </td>
          <td>
            <a href="{% url 'todo_list:tag-delete' pk=tag.id %}?next={{ request.get_full_path|urlencode }}" class="btn btn-secondary">Delete</a>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>There are no tags at the moment</p>
  {% endif %}
{% endblock %}
